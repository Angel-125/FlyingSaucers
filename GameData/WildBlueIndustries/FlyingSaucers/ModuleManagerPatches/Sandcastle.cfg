// ModuleCargoPart cannot coexist with stock inventory modules. ModuleStorablePart
// lets these inventory-equipped parts participate in Sandcastle construction.

@PART[wbiA51ConferenceRoom,wbiA51CrewCabin]:HAS[!MODULE[ModuleStorablePart]]:NEEDS[Sandcastle]
{
	MODULE
	{
		name = ModuleStorablePart
		packedVolume = 5100
	}
}

