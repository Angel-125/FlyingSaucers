PART:NEEDS[KIS]
{
	name = giorgioHairpiece
	module = Part
	author = Angel-125

	MODEL
	{
		model = WildBlueIndustries/FlyingSaucers/Parts/Utility/KISItems/GiorgioHairpiece
		scale = 1.25,1.25,1.25
	}
	rescaleFactor = 1
	node_attach = 0, 0, 0, 1, 0, 0, 1

	TechRequired = start
	entryCost = 80
	cost = 8
	category = Utility
	subcategory = 0
	manufacturer = Giorgio's Hair Salon
	title = #LOC_KFS_hairTitle // Giorgio Kerman Hair Crown
	description = #LOC_KFS_hairDesc // When asked what inspired him to create this fashionable hair crown, Giorgio Kerman said, "I'm not saying it was aliens, but it was aliens."

	// attachment rules: stack, srfAttach, allowStack, allowSrfAttach, allowCollision
	attachRules = 0,1,0,0,0

	// --- standard part parameters ---
	mass = 0.001
	dragModelType = default
	maximum_drag = 0.2
	minimum_drag = 0.2
	angularDrag = 2
	crashTolerance = 8
	maxTemp = 1200
	breakingForce = 50
	breakingTorque = 50
	bulkheadProfiles = srf

	MODULE
	{
		name = ModuleKISItem
		shortcutKeyAction = equip
		equipRemoveHelmet = true
		volumeOverride = 0.001
		equipable = true
		equipSlot = helmet
		useName = use
		equipMeshName = helmet
		equipBoneName = bn_helmet01
		equipPos = (-0.27, 0.1, 0)
		equipDir = (-63, 90, 0)
	}
}
