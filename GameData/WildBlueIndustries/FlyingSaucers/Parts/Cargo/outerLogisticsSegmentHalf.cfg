PART
{
	name = wbiOuterLogisticsSegmentHalf
	module = Part
	author = Angel-125

	MODEL
	{
		model = WildBlueIndustries/FlyingSaucers/Parts/sharedAssets/outerLogisticsSectionHalf
	}
	MODEL
	{
		model = WildBlueIndustries/FlyingSaucers/Parts/sharedAssets/coilCoversOuterHalf
	}

	rescaleFactor = 1

	NODE
	{
		name = Mount1
		transform = node001
		size = 4
	}

	TechRequired = wbiMothershipTech
	category = Cargo
	subcategory = 0
	entryCost = 24200
	cost = 5750

	manufacturer = <CLASSIFIED>
	title = #LOC_KFS_logisticsOuterHalfTitle // Outer Logistics Segment (Half)
	description = #LOC_KFS_logisticsOuterHalfDesc // This compact modular slice of the mothership's outer ring provides reinforced cargo space in a reduced footprint. Designed for flexible layouts, it allows crews to adjust capacity without committing to a full-sized segment. After all, sometimes half is exactly enough.
	attachRules = 1,0,1,1,0
	mass = 2
	dragModelType = none
	maximum_drag = 0.02
	minimum_drag = 0.02
	angularDrag = 0.2
	crashTolerance = 60
	thermalMassModifier = 8.0
	emissiveConstant = 0.95
	maxTemp = 3200
	explosionPotential = 0.1
	fuelCrossFeed = True
	breakingForce = 500000
	breakingTorque = 500000
	bulkheadProfiles = size4
	tags = cck-KFS

	MODULE
	{
		name = ModuleConductionMultiplier
		modifiedConductionFactor = 0.003
		convectionFluxThreshold = 3000
	}

	//65% of the total volume is dedicated to storage. The rest is crawlspace.
	MODULE
	{
		name = ModuleInventoryPart		
		InventorySlots = 9
		packedVolumeLimit = 48000
	}
	
	MODULE:NEEDS[Sandcastle]
    {
        name = ModuleStorablePart
        packedVolume = 216760
    }

	MODULE
	{
		name = ModuleLiftingSurface
		useInternalDragModel = True
		deflectionLiftCoeff = 2.25
		dragAtMaxAoA = 0.002
		dragAtMinAoA = 0.0
	}

	MODULE
	{
		name = WBIOmniStorage

		//In liters, how much can the part store.
		storageVolume = 48000

		//Skill required to reconfigure the container.
		reconfigureSkill = ConverterSkill

		//Minimum rank to reconfigure the container.
		reconfigureRank = 1

		//Resource required to reconfigure the container.
		requiredResource = Equipment

		//Amount of the required resource to reconfigure the container.
		requiredAmount = 0

		lockedResources = Lead;StaticCharge
	}

	MODULE
	{
		// This part module will conditionally hide/show meshes based on certain conditions.
		name = WBIModuleConditionalMeshToggle
		debugMode = true

		MESH_TOGGLE
		{
			// Add one or more meshName entries
			meshName = coilCoversOuterHalf
			techRequired = wbiAdvMothershipTech
		}
	}

	MODULE:NEEDS[WildBlueCore]
	{
		name = WBIModuleFuelPump
	}

	RESOURCE
	{
		name = Lead
		amount = 0
		maxAmount = 500
	}

	RESOURCE
	{
		name = StaticCharge
		amount = 0
		maxAmount = 150
