	title = #LOC_KFS_logisticsInnerTitle // Inner Logistics Segment
	description = #LOC_KFS_logisticsInnerDesc // This modular slice of the mothership's inner ring stores bulk resources, spare parts, and the "absolutely essential" extras every crew insists on bringing. Its scalable storage capacity adapts to mission demands- because even deep-space explorers need somewhere to stash their odds and ends.
	attachRules = 1,0,1,1,0
