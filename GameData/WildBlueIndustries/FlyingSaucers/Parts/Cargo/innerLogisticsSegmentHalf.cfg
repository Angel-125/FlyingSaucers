	category = Cargo
	subcategory = 0
	entryCost = 23300
	cost = 6500

	manufacturer = <CLASSIFIED>
	title = #LOC_KFS_logisticsInnerHalfTitle // Inner Logistics Segment (Half)
	description = #LOC_KFS_logisticsInnerHalfDesc // This modular slice of the mothership's inner ring stores bulk resources, spare parts, and the "absolutely essential" extras every crew insists on bringing. Its scalable storage capacity adapts to mission demands- because even deep-space explorers need somewhere to stash their odds and ends.
	attachRules = 1,0,1,1,0
	mass = 4.5
	dragModelType = none
	maximum_drag = 0.02
	minimum_drag = 0.02
	angularDrag = 0.2
	stackSymmetry = 1
	crashTolerance = 60
	thermalMassModifier = 8.0
	emissiveConstant = 0.95
	maxTemp = 3200
	explosionPotential = 0.1
	fuelCrossFeed = True
	breakingForce = 500000
	breakingTorque = 500000
	bulkheadProfiles = size4
	tags = cck-KFS

	MODULE
	{
		name = ModuleConductionMultiplier
		modifiedConductionFactor = 0.003
		convectionFluxThreshold = 3000
	}

	MODULE
	{
		name = ModuleInventoryPart		
		InventorySlots = 24
		packedVolumeLimit = 118625
	}

	MODULE
	{
		name = ModuleLiftingSurface
		useInternalDragModel = True
		deflectionLiftCoeff = 2.25 // 2.25x the original part's lift.
		dragAtMaxAoA = 0.002
		dragAtMinAoA = 0.0
	}

	MODULE
	{
		name = WBIOmniStorage

		//In liters, how much can the part store.
		storageVolume = 118625

		//Skill required to reconfigure the container.
		reconfigureSkill = ConverterSkill

		//Minimum rank to reconfigure the container.
		reconfigureRank = 1

		//Resource required to reconfigure the container.
		requiredResource = Equipment

		//Amount of the required resource to reconfigure the container.
		requiredAmount = 0

		lockedResources = Lead;StaticCharge
	}

	MODULE
	{
		name = WBIResourceDischarger

		//List of resources that are discharged. Separate resources by semicolon.
		dischargedResources = StaticCharge

		//Units per second
		landedDischargeRate = 0.1
		//List of resources required to discharge the above resources.
		//Format: ResourceName,Amount;ResourceName,Amount
//		landedResourcesRequired = TBD

		splashedDischargeRate = 0.1
//		spashedResourcesRequired = TBD

		atmosphericDischargeRate = 0.02
//		atmosphereResourcesRequired = TBD

		vacuumDischargeRate = 0.01
		vacuumResourcesRequired = XenonGas,0.001
	}

	MODULE
	{
		name = ModuleDynamicNodes
		autostrut = true
		NODE_SET
		{
			DisplayText = #LOC_KFS_Nodes1 // One
			MeshTransform = StandardHatches
			NodePrefix = STD_
			SetCount = 1 //How many nodes in the node set
			Symmetry = 1
		}		
		
		NODE_SET
		{
			DisplayText = #LOC_KFS_Nodes2 // Two
			MeshTransform = HalfHatches
			NodePrefix = HLF_
			SetCount = 2
			Symmetry = 1
		}
	}

	MODULE:NEEDS[WildBlueCore]
