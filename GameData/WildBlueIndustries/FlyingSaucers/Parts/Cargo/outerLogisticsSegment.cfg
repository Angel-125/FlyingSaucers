PART
{
	name = wbiOuterLogisticsSegment
	module = Part
	author = Angel-125

	MODEL
	{
		model = WildBlueIndustries/FlyingSaucers/Parts/sharedAssets/outerLogisticsSection
	}
	MODEL
	{
		model = WildBlueIndustries/FlyingSaucers/Parts/sharedAssets/coilCoversOuterSection
	}
	MODEL:NEEDS[WildBlueCore]
	{
		model = WildBlueIndustries/FlyingSaucers/Parts/sharedAssets/outerSectionDecal
	}

	rescaleFactor = 1

	NODE
	{
		name = Mount1
		transform = node001
		size = 4
	}

	TechRequired = wbiMothershipTech
	category = Cargo
	subcategory = 0
	entryCost = 60500
	cost = 14375

	manufacturer = <CLASSIFIED>
	title = #LOC_KFS_logisticsOuterTitle // Outer Logistics Segment
	description = #LOC_KFS_logisticsOuterDesc // This modular slice of the mothership's outer ring provides reinforced cargo space for bulk supplies and mission equipment. Designed to scale with expedition demands, it allows crews to expand capacity as objectives evolve. After all, plans change- usually right after launch.
	attachRules = 1,0,1,1,0
	mass = 4
	dragModelType = none
	maximum_drag = 0.02
	minimum_drag = 0.02
	angularDrag = 0.2
	crashTolerance = 60
	thermalMassModifier = 8.0
	emissiveConstant = 0.95
	maxTemp = 3200
	explosionPotential = 0.1
	fuelCrossFeed = True
	breakingForce = 500000
	breakingTorque = 500000
	bulkheadProfiles = size4
	tags = cck-KFS

	MODULE
	{
		name = ModuleConductionMultiplier
		modifiedConductionFactor = 0.003
		convectionFluxThreshold = 3000
	}

	//65% of the total volume is dedicated to storage. The rest is crawlspace.
	MODULE
	{
		name = ModuleInventoryPart		
		InventorySlots = 15
		packedVolumeLimit = 96000
	}

	MODULE
	{
		name = ModuleLiftingSurface
		useInternalDragModel = True
		deflectionLiftCoeff = 4.5 // 2.25x
		dragAtMaxAoA = 0.002
		dragAtMinAoA = 0.0
	}

	MODULE
	{
		name = WBIOmniStorage

		//In liters, how much can the part store.
		storageVolume = 96000

		//Skill required to reconfigure the container.
		reconfigureSkill = ConverterSkill

		//Minimum rank to reconfigure the container.
		reconfigureRank = 1

		//Resource required to reconfigure the container.
		requiredResource = Equipment

		//Amount of the required resource to reconfigure the container.
		requiredAmount = 0

		lockedResources = Lead;StaticCharge
	}

	MODULE
	{
		// This part module will conditionally hide/show meshes based on certain conditions.
		name = WBIModuleConditionalMeshToggle
		debugMode = true

		MESH_TOGGLE
		{
			// Add one or more meshName entries
			meshName = coilCoversOuter
			techRequired = wbiAdvMothershipTech
		}
	}

	MODULE:NEEDS[WildBlueCore]
	{
		name = WBIModuleDecal
		decalTransforms = decal
		isVisible = false
		toggleDecalName = #LOC_WILDBLUECORE_toggleDecal // Toggle Decal
		selectDecalName = #LOC_WILDBLUECORE_changeDecal // Change Decal
	}

	MODULE:NEEDS[WildBlueCore]
	{
		name = WBIModuleFuelPump
	}

	RESOURCE
	{
		name = Lead
		amount = 0
		maxAmount = 1000
	}

	RESOURCE
	{
		name = StaticCharge
		amount = 0
		maxAmount = 300
	}

