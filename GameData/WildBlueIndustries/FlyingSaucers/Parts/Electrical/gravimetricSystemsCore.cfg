	TechRequired = wbiMothershipTech
	category = Electrical
	subcategory = 0
	entryCost = 375000
	cost = 375000

	manufacturer = <CLASSIFIED>
	title = #LOC_KFS_engCoreTitle // Gravimetric Systems Core
	description = #LOC_KFS_engCoreDesc // This integrated power and field-control module generates gravity waves for propulsion while supplying electric charge to the vessel. Excess static buildup will trigger an automatic safety shutdown- because exploding motherships are generally frowned upon. Includes auxiliary fusion generation and an emergency atomic battery for those moments when "this is fine" clearly isn't.
	attachRules = 1,0,1,1,0
	mass = 32
	dragModelType = none
	maximum_drag = 0.02
	minimum_drag = 0.02
	angularDrag = 0.2
	stackSymmetry = 1
	crashTolerance = 60
	thermalMassModifier = 8.0
	emissiveConstant = 0.95
	maxTemp = 3200
	explosionPotential = 0.1
	fuelCrossFeed = True
	breakingForce = 500000
	breakingTorque = 500000
	bulkheadProfiles = size4
	tags = cck-KFS

	MODULE
	{
		name = ModuleConductionMultiplier
		modifiedConductionFactor = 0.003
		convectionFluxThreshold = 3000
	}

	MODULE
	{
		name = ModuleReactionWheel
		PitchTorque = 240
		YawTorque = 240
		RollTorque = 240
		RESOURCE
		{
			name = ElectricCharge
			rate = 4.8 // 0.02 / UNIT OF TORQUE
		}
	}

	MODULE
	{
		name = WBIModuleGenerator
		ConverterName = Main Power
		StartActionName = Activate Main Power
		StopActionName = Deactivate Main Power
		ToggleActionName = Toggle Main Power
		FillAmount = 1.0
		AutoShutdown = false
		GeneratesHeat = false
		UseSpecialistBonus = false
		startEffect = effectStart
		stopEffect = effectStop
		runningEffect = effectRunningGravity
		 
		INPUT_RESOURCE
		{
			ResourceName = Graviolium
			Ratio = 0.025
			FlowMode = STAGE_PRIORITY_FLOW
		}
		INPUT_RESOURCE
		{
			ResourceName = FusionPellets
			Ratio = 0.00047
			FlowMode = STAGE_PRIORITY_FLOW
		}
		OUTPUT_RESOURCE
		{
			ResourceName = GravityWaves
			Ratio = 625
			DumpExcess = true
			FlowMode = ALL_VESSEL
		}
		OUTPUT_RESOURCE
		{
			ResourceName = wbiElectroPlasma
			Ratio = 9375
			DumpExcess = true
			FlowMode = ALL_VESSEL
		}
		OUTPUT_RESOURCE
		{
			ResourceName = ElectricCharge
			Ratio = 37.5
			DumpExcess = true
			FlowMode = ALL_VESSEL
		}
		OUTPUT_RESOURCE
		{
			ResourceName = StaticCharge
			Ratio = 0.025
			DumpExcess = false
			FlowMode = ALL_VESSEL
		}
		DRAINED_RESOURCE
		{
			ResourceName = GravityWaves
			Ratio = 62.5
			FlowMode = NO_FLOW
		}
		DRAINED_RESOURCE
		{
			ResourceName = wbiElectroPlasma
			Ratio = 90
			FlowMode = NO_FLOW
		}
	}

	MODULE
	{
		name = WBIModuleGenerator
		ConverterName = Auxilary Power
		StartActionName = Activate Auxilary Power
		StopActionName = Deactivate Auxilary Power
		ToggleActionName = Toggle Auxilary Power
		FillAmount = 1.0
		AutoShutdown = false
		GeneratesHeat = false
		UseSpecialistBonus = false
		startEffect = effectStart
		stopEffect = effectStop
		runningEffect = effectRunningFusion
		 
		INPUT_RESOURCE
		{
			ResourceName = FusionPellets
			Ratio = 0.0002
			FlowMode = STAGE_PRIORITY_FLOW
		}

		OUTPUT_RESOURCE
		{
			ResourceName = ElectricCharge
			Ratio = 200
			DumpExcess = true
			FlowMode = STAGE_PRIORITY_FLOW
		}

		OUTPUT_RESOURCE
		{
			ResourceName = wbiElectroPlasma
			Ratio = 200
			DumpExcess = true
			FlowMode = STAGE_PRIORITY_FLOW
		}

		REQUIRED_RESOURCE
		{
			ResourceName = ElectricCharge
			Ratio = 200
		}

		DRAINED_RESOURCE
		{
			ResourceName = wbiElectroPlasma
			Ratio = 90
			FlowMode = NO_FLOW
		}
	}

	MODULE
	{
		name = ModuleGenerator
		statusGUIName = Atomic Battery
		isAlwaysActive = true
		OUTPUT_RESOURCE
		{
			name = ElectricCharge
			rate = 0.75
		}
	}

	// Graviolium is normally not a tweakable resource, meaning you have to fill up your tanks while in flight.
	// Without Kerbal Flying Saucers, the only way to get the resource is to mine asteroids.
	// But this cheat lets you tweak the resource in the editor.
	MODULE:NEEDS[WildBlueIndustries/Blueshift]
	{
		name = WBIResourceTweaker
		resourceName = Graviolium
		tweakEnabledName = CHEAT: Enable Graviolium tweak
		tweakDisabledName = CHEAT: Disable Graviolium tweak
		isEnabled = true
	}

